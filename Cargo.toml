[package]
name = "music-looper"
version = "0.1.0"
edition = "2024"
description = "Finds seamless loop points in music and reads/writes loop tags (a Rust port of PyMusicLooper)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
lofty = "0.25.4"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = "0.6.1"
